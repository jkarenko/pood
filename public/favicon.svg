<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Polaroid frame, slightly tilted -->
  <g transform="rotate(-6 24 24)">
    <!-- Shadow -->
    <rect x="9" y="5" width="30" height="36" rx="1.5" fill="#c4b5a0" opacity="0.5" transform="translate(1.5, 1.5)"/>
    <!-- White frame -->
    <rect x="9" y="5" width="30" height="36" rx="1.5" fill="#faf6f0" stroke="#d4c9b8" stroke-width="1"/>
    <!-- Image area -->
    <rect x="13" y="9" width="22" height="20" rx="0.5" fill="#e8ddd0"/>
    <!-- Simple landscape in image -->
    <circle cx="20" cy="16" r="3" fill="#f0c87a" opacity="0.8"/>
    <path d="M13 25 L20 18 L27 23 L31 19 L35 24 L35 29 L13 29 Z" fill="#8a7560" opacity="0.6"/>
    <path d="M13 27 L19 22 L25 26 L35 20 L35 29 L13 29 Z" fill="#6a5b4a" opacity="0.5"/>
    <!-- Name scribble area -->
    <line x1="16" y1="34" x2="32" y2="34" stroke="#baa994" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
